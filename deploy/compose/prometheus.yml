# Prometheus configuration for the compose stack.
#
# It is separate from deploy/prometheus.yml because that one scrapes nodes
# running as local processes on 127.0.0.1. Here the targets are container
# names on the compose network, and pointing a single file at both would
# silently fail in whichever environment it was not written for.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: raftkv
    static_configs:
      - targets:
          - raftkv-1:9101
          - raftkv-2:9101
          - raftkv-3:9101
          - raftkv-4:9101
          - raftkv-5:9101
    relabel_configs:
      - source_labels: [__address__]
        regex: raftkv-(\d+):.*
        target_label: node
        replacement: $1
