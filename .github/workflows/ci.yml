# Continuous verification of the claims this repository makes about itself.
#
# The README says the suite is green, clean under the race detector, and that
# the chaos scenarios hold. Those were true each time somebody ran them by
# hand, which is a weaker statement than it sounds: the interesting failures
# here have all been ones that no existing test noticed, and a suite nobody
# runs on a schedule is a suite that rots quietly.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The chaos suite and the fuzzers explore, so running them again on
  # unchanged code is not wasted: a different seed or a longer fuzz budget
  # reaches inputs the last run did not.
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Taken from go.mod so the toolchain cannot drift from what the
          # module declares.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        # Generated protobuf code is excluded: it is formatted by its
        # generator and reformatting it would only produce a diff against the
        # next regeneration.
        run: |
          unformatted=$(gofmt -l . | grep -v '\.pb\.go$' || true)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go vet with the fakecluster tag
        # cmd/gateway registers --fake-cluster only under this tag (the
        # production binary can never serve fake data), so the tagged variant
        # gets its own compile check and test run.
        run: |
          go vet -tags fakecluster ./cmd/gateway/...
          go test -tags fakecluster -count=1 ./cmd/gateway/...

      - name: build
        run: go build ./...

      - name: README counts are current
        # internal/determinism fails if the README's test count is stale, but only after
        # the whole suite. This is the same check in seconds, and it names the fix:
        # run `make readme-counts` and commit README.md.
        run: go run ./cmd/readmecounts -check

      - name: test
        # -count=1: a cached pass can hide a flake (T6.4).
        run: go test -count=1 ./...

      - name: test on a single processor
        # Concurrency here is not incidental: group commit batches the writes
        # that are already waiting, and whether any are waiting is the
        # scheduler's decision. Tuned on a machine with eleven cores, the
        # batching silently stopped happening on one, because the other
        # writers were runnable but had not yet reached their send. The
        # feature went on looking like it worked.
        #
        # This is cheap and it is the only thing that would have caught that
        # deliberately rather than by luck of whatever the runner had.
        run: GOMAXPROCS=1 go test -count=1 ./...

      - name: test with the race detector
        # The driver, the transport and the chaos harness all run real
        # goroutines, and the race detector is the only thing that checks the
        # boundary between them is respected.
        run: go test -race ./...

  flake-guard:
    name: flake guard (advisory, load=${{ matrix.load }})
    # Re-runs the tests this PR adds or changes, many times, in the three CI modes
    # (T6.4, docs/ci.md). A PR with no test changes finishes in seconds; the job is
    # skipped-green on pushes, never absent, so it can be made required later.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ADVISORY at launch: the human makes it required in branch protection after two
    # weeks. A failure still shows as a red step, an ::error annotation and the step
    # summary; nothing retries it and no label is set (this workflow has no
    # pull-requests: write).
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # 0 = the three modes; 1 = plain and race beside cmd/cpuhog, only for
        # internal/gateway and internal/transport selections (docs/ci.md).
        load: ["0", "1"]
    steps:
      - uses: actions/checkout@v4
        with:
          # BASE...HEAD needs the merge base.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: flake-guard
        env:
          BASE_REF: ${{ github.base_ref }}
          LOAD: ${{ matrix.load }}
        run: BASE="origin/$BASE_REF" scripts/flake-guard.sh

  flaky-nightly:
    name: nightly -count=20 (race)
    # The scheduled run only: raft, storage and statemachine as `make test-flaky`, plus
    # internal/gateway and internal/transport, where the CI-only races were.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test-flaky-nightly
        run: make test-flaky-nightly

  mutation:
    name: mutation suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: vet with the faultinject tag
        run: go vet -tags faultinject ./...

      - name: test with the faultinject tag
        # RUNBOOK 8.6: nine known bugs sit behind this tag and an oracle must flag
        # each. TestMutationSuite is red if any is undetected, if the control run
        # (every switch off) is not clean, or if a switch has no call site. With
        # no switch enabled the same packages must still pass, so the tag does
        # not change the default behaviour.
        run: >
          go test -tags faultinject -count=1 -timeout 20m
          ./chaos ./internal/raft ./internal/statemachine ./internal/storage
          ./internal/faultinject ./internal/determinism

      - name: the results document is current
        # The results table is generated, without timestamps, so any difference
        # means a result changed and the document was not regenerated.
        run: |
          WRITE_CHAOS_RESULTS=1 go test -tags faultinject -count=1 ./chaos -run TestMutationSuite
          git diff --exit-code docs/CHAOS_RESULTS.md

  fuzz:
    name: fuzz the decoders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: fuzz
        # Every decoder that parses bytes from a disk that may be damaged or
        # from another node. Six bugs came out of these in the first ten
        # minutes of fuzzing, including a sixteen byte snapshot that allocated
        # three gigabytes, so a minute each on every push is cheap insurance.
        #
        # Failing inputs are kept as a corpus and replayed by `go test`, so a
        # regression found here fails the job above from then on.
        #
        # -fuzzminimizetime 0s: a new interesting input is otherwise minimized
        # for up to 60s by default, which stalls the workers and overruns
        # -fuzztime, failing the run with "context deadline exceeded" though
        # no input failed. The engine can also report plain -fuzztime expiry
        # that way, so that error alone (no "Failing input written") is
        # downgraded to a warning.
        run: |
          set -eo pipefail
          fuzz() {
            echo "::group::$2 ($1)"
            out=$(mktemp)
            if ! go test "$1" -run xxx -fuzz "$2" -fuzztime 60s -fuzzminimizetime 0s 2>&1 | tee "$out"; then
              # The engine sometimes reports its own -fuzztime expiry as a
              # failure. A real finding always writes a failing input.
              if grep -q "context deadline exceeded" "$out" && ! grep -q "Failing input written" "$out"; then
                echo "::warning::$2: fuzz engine deadline flake, not a finding"
              else
                exit 1
              fi
            fi
            echo "::endgroup::"
          }
          fuzz ./internal/statemachine/ FuzzDecodeCommand
          fuzz ./internal/statemachine/ FuzzRestore
          fuzz ./internal/storage/ FuzzReadRecord
          fuzz ./internal/storage/ FuzzDecodeEntry
          fuzz ./internal/storage/ FuzzDecodeHardState
          fuzz ./internal/storage/ FuzzDecodeSnapshotMeta
          fuzz ./internal/raft/ FuzzDecodeConfChange
          fuzz ./internal/transport/ FuzzMessageFromWire

      - name: upload any failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  web:
    name: web dashboard
    # D7. Runs on every push and PR rather than behind a path filter: it takes about a minute,
    # needs no secrets, and a job that is skipped cannot be a required check that stays green.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install (lockfile only)
        run: npm ci

      - name: no Go files under node_modules
        # gofmt -l ., go vet ./..., go list ./... and the README count walks all descend into
        # web/node_modules. An npm package that ships a .go file (ESLint's flatted did) would
        # change what they see. See docs/web.md.
        run: npm run check:no-go

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: unit tests
        run: npm test

      - name: build
        run: npm run build

      - name: no secret-looking strings in the bundle
        run: npm run check:dist

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: contract test against the real demo gateway
        # The in-process mock behind `npm test` is checked against the real internal/gateway
        # (in-memory fakecluster build, no AWS) so the two cannot drift apart unnoticed.
        run: |
          scripts/dev-gateway.sh http://localhost:5173 > "$RUNNER_TEMP/gateway.log" 2>&1 &
          for _ in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz
          CONTRACT_GATEWAY=http://127.0.0.1:8080 npm run test:contract
