# Credential-free checks for infra/ (RUNBOOK 10.3 D1, D2, D4). Nothing here talks to AWS: no
# credentials, no secrets, no OIDC role, no `terraform plan`, no backend. Provider plugins come
# from the public registry and are verified against the committed .terraform.lock.hcl files
# (-lockfile=readonly), so a provider upgrade is always an explicit commit. Applying is a human
# action done from a laptop (infra/README.md).
name: infra

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "scripts/rolling-update*"
      - "scripts/demo-*"
      - "scripts/ops*"
      - "docs/OPS.md"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "infra/**"
      - "scripts/rolling-update*"
      - "scripts/demo-*"
      - "scripts/ops*"
      - "docs/OPS.md"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

jobs:
  terraform:
    name: terraform ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [infra/bootstrap, infra/modules/network, infra/modules/compute, infra/envs/demo]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      # Actions are pinned to commit SHAs (the comment gives the tag).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

      - name: terraform init (no backend, lock file read-only)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: terraform validate
        run: terraform validate

      - name: terraform test (mock provider)
        # bootstrap, the network module and the compute module have tests/; envs/demo has none.
        run: |
          if [ -d tests ]; then
            terraform test
          else
            echo "no tests/ in ${{ matrix.dir }}"
          fi

  policy:
    name: policy script and fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: self-test (bad fixtures must fail, good must pass)
        run: infra/policy/selftest.sh

      - name: forbidden resources and literal wildcards in the sources
        run: infra/policy/check.sh --hcl infra

  scripts:
    name: token scripts (stub aws and ssh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The tests put STUB aws, ssh, sudo, chown and systemctl first on PATH: nothing reaches AWS or a
      # host, and the assertions fail if any token value shows up in a logged command line or output.
      - name: fetch-gateway-tokens.sh
        run: bash infra/scripts/fetch-gateway-tokens_test.sh

      - name: push-node-tokens.sh
        run: bash infra/scripts/push-node-tokens_test.sh

      # D9 ops scripts: STUB aws that models the cluster; no terraform, ssh or scp is ever reachable.
      - name: rolling-update.sh
        run: bash scripts/rolling-update_test.sh

      - name: demo-pause.sh and demo-down.sh
        run: |
          bash scripts/demo-pause_test.sh
          bash scripts/demo-down_test.sh

      - name: docs/OPS.md
        run: bash scripts/ops-doc_test.sh

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.55.1

      - name: tflint --init
        working-directory: infra
        env:
          # Only rate-limits the plugin download from GitHub; the built-in token has no repo access beyond this.
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init

      - name: tflint
        working-directory: infra
        run: tflint --recursive --config "$GITHUB_WORKSPACE/infra/.tflint.hcl"
